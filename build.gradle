plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143' // port-26.1.2: флотская версия (ловушка14)
    id 'io.freefair.lombok' version '9.5.0' // port-26.1.2: как в mekanism-stack (Java25)
}

group = mod_group_id
version = minecraft_version + "-" + mod_version

base {
    archivesName = JarFileName
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25) // port-26.1.2: Java 25

lombok {
    version = "1.18.46" // port-26.1.2: как в Mekanism-MoreMachine (совместим с Java25)
}

// port-26.1.2: datagen-исходники живут в отдельном sourceSet src/data (не входит в compileJava).
// port-26.1.2: data sourceSet подключается только к datagen-запускам.
sourceSets {
    data {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    // port-26.1.2: AT из исходного дерева
    accessTransformers = project.files("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // port-26.1.2: run-типа "data" в neoforge26 больше нет (ловушка66) — serverData/clientData
        serverData {
            serverData()
            sourceSet = sourceSets.data
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        clientData {
            clientData()
            sourceSet = sourceSets.data
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// port-26.1.2: keep datagen classes out of ordinary client/server launches.
neoForge.mods.register('emextrasDatagen') {
    sourceSet(sourceSets.main)
    sourceSet(sourceSets.data)
}
neoForge.runs.configureEach {
    loadedMods = [neoForge.mods.getByName(name in ['serverData', 'clientData'] ? 'emextrasDatagen' : project.mod_id)]
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal() // port-26.1.2: наш Mekanism homebaked + EMI из .m2
    mavenCentral()
}

dependencies {
    // --- Портированные деревья-зависимости флота (jar'ы собраны из портированных исходников,
    // лежат в /root/home/forks/work/evolved-mekanism-extras-26.1.2/dep-libs, ловушка70) ---
    // Evolved Mekanism: worktrees/evolved-mekanism-26.1.2/build/classes
    compileOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/evolvedmekanism-26.1.2.jar")
    // Mekanism Extras (modId mekanism_extras): порт флота, реальный 26.1.2-джар
    compileOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/mekanism_extras-26.1.2-1.4.2-fix7-atm11-0.9.0.jar")
    // Mekanism MoreMachine (modId mekmm) + пакет com.jerry.mekaf — из одного дерева mekanism-stack/Mekanism-MoreMachine
    compileOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/mekmm-2.0.0-26.1.2.jar")
    // server smoke: обязательные моды и mekaf-интеграция должны загружаться и в dev-runtime.
    runtimeOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/evolvedmekanism-26.1.2.jar")
    runtimeOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/mekanism_extras-26.1.2-1.4.2-fix7-atm11-0.9.0.jar")
    runtimeOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/mekmm-2.0.0-26.1.2.jar")
    // MTO (modId mekanismtieredoutlines) — только для миксина MixinMTOModClient
    compileOnly files("../../work/evolved-mekanism-extras-26.1.2/dep-libs/mekanism-tiered-outlines-mto-0.1.0.jar")

    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"

    compileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api"
    // port-26.1.2: EMI-only политика флота — runtimeOnly включён
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"

    implementation "mekanism:Mekanism:${minecraft_version}-${mekanism_version}" // core
    runtimeOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:additions"
    runtimeOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:generators"
    runtimeOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:tools"
}

// port-26.1.2: EMI-миксины НЕ компилируются — их целевых классов во флоте нет:
//   - mekanism.client.recipe_viewer.emi.MekanismEmi не собирается в homebaked Mekanism (disableEMI);
//   - com.jerry.mekmm.client.recipe_viewer.emi.MoreMachineEMI исключён из сборки mekmm.
// TODO port-26.1.2: восстановить EMI-покрытие emextras после появления EMI-плагинов Mekanism/mekmm
// (или написать собственный EMI-плагин emextras) и вернуть эти миксины в компиляцию и в emextras.mixins.json.
sourceSets {
    main {
        java {
            exclude 'io/github/masyumero/emextras/mixin/client/MixinMekanismEmi.java'
            exclude 'io/github/masyumero/emextras/mixin/client/MixinMoreMachineEMI.java'
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            neo_version               : neo_version,
            neo_version_range         : neo_version_range,
            loader_version_range      : loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description,
            mekanism_version_range    : mekanism_version_range,
            evolvedmekanism_version_range  : evolvedmekanism_version_range,
            mekanism_extras_version_range  : mekanism_extras_version_range,
            mekmm_version_range       : mekmm_version_range,
            mto_version_range         : mto_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Include resources generated by data generators (см. также sourceSet выше).
jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '1000'] // port-26.1.2: снять дефолтный лимит100 — иначе не виден полный остаток (ловушка69)
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
